<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디자인씽킹 피드백 그리드</title><style>
:root{font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#26343b;background:#f5f8f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{max-width:1480px;margin:auto;padding:38px 40px 24px}h1{font-size:30px;margin:9px 0 12px;letter-spacing:-1px}.eyebrow{color:#328ba2;font-size:13px;font-weight:700;letter-spacing:2px}.intro{color:#6b777b;font-size:15px;line-height:1.7;margin:0}.layout{max-width:1480px;padding:0 40px 50px;margin:auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:26px}aside{align-self:start;background:white;border:1px solid #e0e7e8;border-radius:12px;padding:24px}.field{margin-bottom:20px}label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}input,select,textarea{font:inherit;color:inherit;border:1px solid #d8e1e3;border-radius:7px;background:white;padding:12px;width:100%}select{font-size:15px}input:focus,select:focus,textarea:focus{outline:2px solid #57a8bb;outline-offset:2px}.topic{font-size:15px;line-height:1.7;margin:14px 0;color:#41575f}summary{cursor:pointer;font-size:14px;color:#328ba2;padding:10px 0}#source{font-size:14px;line-height:1.8;white-space:pre-wrap;max-height:390px;overflow:auto}.hint{font-size:12px;line-height:1.7;color:#78858a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}button,.link{font:inherit;font-size:14px;padding:11px 15px;border:1px solid #cedde0;border-radius:7px;background:white;color:#355560;cursor:pointer;text-decoration:none}button:hover,.link:hover{background:#edf6f7}.primary{background:#328da4;color:white;border-color:#328da4}.primary:hover{background:#287a8f}.paper{background:white;border:1px solid #e0e7e8;border-radius:12px;padding:34px 38px}.paper h2{font-size:25px;margin:0 0 12px;letter-spacing:-.7px}.meta{font-size:14px;color:#6b777b;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;margin-top:27px}.cell{padding:25px 25px 20px;min-height:230px}.cell:nth-child(odd){border-right:1px solid #bdc9cd;padding-left:0}.cell:nth-child(even){padding-right:0}.cell:nth-child(-n+2){border-bottom:1px solid #bdc9cd}.cell h3{font-size:21px;color:#3695ad;margin:0 0 12px;display:flex;align-items:center;gap:15px}.symbol{font-size:32px;font-weight:400;min-width:28px}.en{font-size:16px;font-weight:500}.prompt{font-size:13px;color:#7d888d;line-height:1.6;margin:0 0 13px}textarea{resize:vertical;min-height:100px;font-size:15px;line-height:1.75;background:#fcfdfd}textarea::placeholder{color:#a0aaad}.extra{border-top:1px solid #e0e7e8;padding-top:22px;margin-top:20px}.extra label{color:#328da4;font-size:17px}.extra textarea{min-height:70px}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.status{font-size:12px;color:#6f8185;align-self:center}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 24px;color:white;background:#263f48;border-radius:9px;display:none;z-index:3}.printnote{display:none}@media(max-width:1000px){.layout{grid-template-columns:280px minmax(0,1fr);padding:0 22px 35px;gap:16px}header{padding:28px 22px}.paper{padding:26px 24px}.cell{padding:19px 16px}.en{display:none}}@media(max-width:760px){.layout{display:block}aside{margin-bottom:18px}.paper{padding:25px 20px}.grid{grid-template-columns:1fr}.cell:nth-child(odd){border-right:0}.cell{padding:22px 0!important;border-bottom:1px solid #bdc9cd;min-height:unset}.cell:last-child{border:0}.paper h2{font-size:22px}h1{font-size:27px}.en{display:inline}.bottom{flex-wrap:wrap}}@media print{@page{size:A4 landscape;margin:12mm}body{background:white}header,aside,.bottom,#toast{display:none}.layout{display:block;padding:0;max-width:none}.paper{border:0;padding:0;border-radius:0}.grid{grid-template-columns:1fr 1fr}.cell{min-height:155px;padding:14px 20px}.cell:nth-child(odd){padding-left:0;border-right:1px solid #bdc9cd}.cell:nth-child(even){padding-right:0}.cell:nth-child(-n+2){border-bottom:1px solid #bdc9cd}textarea{display:none}.printnote{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}.prompt{display:none}.extra{margin-top:10px;padding-top:12px}.paper h2{font-size:23px}.cell h3{font-size:19px;margin-bottom:5px}.symbol{font-size:24px}.extra label{font-size:15px}.en{display:inline}}
.view-actions{display:flex;gap:8px;flex-wrap:wrap}.view-actions button,.view-actions a{flex:1;text-align:center;white-space:nowrap}.field-clear{display:block;margin:8px 0 0 auto;padding:4px 9px;font-size:12px;color:#74868b;border-color:#e3e9ea}dialog{width:min(760px,calc(100% - 32px));max-height:85vh;border:1px solid #d8e1e3;border-radius:14px;padding:28px;color:#26343b}dialog::backdrop{background:#173d4b66}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-head h2{font-size:23px;margin:0}dialog #source{max-height:none;overflow:visible}dialog .topic{font-weight:700;border-bottom:1px solid #e0e7e8;padding-bottom:18px}@media print{dialog,.field-clear{display:none!important}}[hidden]{display:none!important}</style></head><body><header><div class="eyebrow">DESIGN THINKING · FEEDBACK GRID</div><h1>서로의 아이디어를 더 나아지게</h1><p class="intro">계획서를 선택하고, 발표 내용과 자신의 경험을 바탕으로 의견을 남겨 주세요.</p></header><main class="layout"><aside><div class="field"><label for="project">피드백할 발표자</label><select id="project" aria-label="피드백할 발표자"></select><p id="topic" class="topic"></p></div><div class="field"><label for="writer">작성자 <span style="font-weight:400;color:#839095">선택</span></label><input id="writer" placeholder="이름을 입력하세요" maxlength="50"></div><p class="hint">모든 칸을 채우지 않아도 괜찮아요.<br>구체적인 장면·이유를 함께 적어 주세요.</p><div class="view-actions"><button id="summaryOpen" type="button">요약서 보기</button><a class="link" target="_blank" rel="noopener noreferrer" href="https://padlet.com/hy7191/padlet-3jjieihmjwwrx6n4">패들렛에서 보기 ↗</a></div><p class="hint" style="margin-top:22px">작성 내용은 이 브라우저에 자동 저장됩니다. 다른 기기나 참여자와 자동 공유되지 않습니다.</p></aside><section class="paper"><h2>디자인씽킹 중간 발표 피드백</h2><div class="meta" id="paperMeta"></div><div class="grid" id="grid"></div><div class="extra"><label for="wow">☆ 멋진 점 · 응원의 한마디</label><textarea id="wow" placeholder="특히 기억에 남는 점이나 응원의 말을 남겨 주세요."></textarea><div class="printnote" id="print-wow"></div></div><div class="extra"><label for="resources">자료 · 사례 · 링크</label><textarea id="resources" placeholder="도움이 될 자료나 사례, 링크를 자유롭게 적어 주세요."></textarea><div class="printnote" id="print-resources"></div></div><div class="bottom"><span class="status" id="status" role="status">자동 저장 준비 중</span><div class="actions"><button id="reset">선택한 과제 지우기</button><button id="resetAll">모두 지우기</button><button id="undo" hidden>지우기 되돌리기</button><button id="print">인쇄 / PDF</button><button class="primary" id="copy">피드백 복사</button></div></div></section></main><dialog id="summaryDialog" aria-labelledby="summaryTitle"><div class="dialog-head"><h2 id="summaryTitle">계획서 요약</h2><button id="summaryClose" type="button">닫기</button></div><p id="summaryTopic" class="topic"></p><div id="source"></div></dialog><div id="toast" role="status"></div><script>
const categories=[['like','+','좋았던 점','I like','사용자의 경험을 잘 반영한 부분은?','인상적인 아이디어나 강점을 적어 주세요.'],['wish','△','보완할 점','I wish','문제 정의와 해결안이 연결되는가?','구체화하거나 개선하면 좋을 부분을 적어 주세요.'],['questions','?','궁금한 점','Questions','어떤 근거로 이 해결안을 선택했나요?','더 알고 싶거나 설명이 필요한 부분을 적어 주세요.'],['whatif','◇','새로운 제안','What if','다른 방법으로 시험해 볼 가능성은?','함께 생각해 볼 아이디어나 적용 방법을 적어 주세요.']];
const $=id=>document.getElementById(id);let projects=[],state={selected:0,writer:'',drafts:{}},storageOK=true;try{const saved=JSON.parse(localStorage.getItem('dt-feedback-v1'));if(saved&&saved.drafts)state=saved}catch(e){storageOK=false}
const fields=[...categories.map(c=>c[0]),'wow','resources'];
for(const [id,symbol,label,en,prompt,placeholder]of categories){const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<h3><span class="symbol">${symbol}</span><label for="${id}" style="margin:0;font:inherit">${label} <span class="en">${en}</span></label></h3><p class="prompt">${prompt}</p><textarea id="${id}" placeholder="${placeholder}"></textarea><div class="printnote" id="print-${id}"></div>`;$('grid').append(cell)}
function draft(){return state.drafts[state.selected]||(state.drafts[state.selected]={})}
function meta(){const p=projects[state.selected];$('paperMeta').textContent=p.name+' · '+p.title+(state.writer?'　/　작성자 '+state.writer:'')}
function save(){try{localStorage.setItem('dt-feedback-v1',JSON.stringify(state));storageOK=true}catch(e){storageOK=false}$('status').textContent=storageOK?'이 브라우저에 자동 저장됨':'저장이 제한되어 있습니다. 복사로 보관해 주세요.'}
function render(){const p=projects[state.selected];$('topic').textContent=p.title;$('source').textContent=p.body;$('summaryTitle').textContent=p.name+' · 계획서 요약';$('summaryTopic').textContent=p.title;$('writer').value=state.writer||'';$('project').value=state.selected;const d=draft();for(const f of fields){$(f).value=d[f]||'';$('print-'+f).textContent=d[f]||' ';}meta();save()}
for(const f of fields)$(f).addEventListener('input',()=>{draft()[f]=$(f).value;$('print-'+f).textContent=$(f).value;save()});$('writer').addEventListener('input',()=>{state.writer=$('writer').value;meta();save()});$('project').addEventListener('change',()=>{state.selected=Number($('project').value);render()});
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3000)}
let deletionBackup=null;
function backup(){deletionBackup=JSON.parse(JSON.stringify(state));$('undo').hidden=false}
$('reset').onclick=()=>{if(confirm('선택한 과제의 피드백을 지울까요? 다른 과제의 기록은 유지됩니다.')){backup();state.drafts[state.selected]={};render();toast('선택한 과제의 내용을 지웠습니다. 되돌릴 수 있습니다.')}};
$('resetAll').onclick=()=>{if(confirm('모든 과제의 피드백과 작성자 이름을 지울까요?')){backup();state.drafts={};state.writer='';render();toast('모든 기록을 지웠습니다. 되돌릴 수 있습니다.')}};
$('undo').onclick=()=>{if(!deletionBackup)return;state=deletionBackup;deletionBackup=null;$('undo').hidden=true;render();toast('지우기 전 기록을 복원했습니다.')};
for(const f of fields){const b=document.createElement('button');b.type='button';b.className='field-clear';b.textContent='지우기';b.setAttribute('aria-label',({like:'좋았던 점',wish:'보완할 점',questions:'궁금한 점',whatif:'새로운 제안',wow:'멋진 점',resources:'자료·사례·링크'})[f]+' 지우기');$(f).after(b);b.onclick=()=>{backup();draft()[f]='';render();$(f).focus();toast('이 칸의 내용을 지웠습니다. 되돌릴 수 있습니다.')}}
$('summaryOpen').onclick=()=>$('summaryDialog').showModal();$('summaryClose').onclick=()=>$('summaryDialog').close();$('summaryDialog').addEventListener('click',e=>{if(e.target===$('summaryDialog')){const r=$('summaryDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('summaryDialog').close()}})
;$('print').onclick=()=>window.print();
$('copy').onclick=async()=>{const p=projects[state.selected],d=draft();if(!fields.some(f=>(d[f]||'').trim()))return toast('피드백을 한 가지 이상 적어 주세요.');const labels=Object.fromEntries(categories.map(c=>[c[0],c[2]]));labels.wow='멋진 점 · 응원의 한마디';labels.resources='자료 · 사례 · 링크';const txt=[p.name+' | '+p.title,state.writer?'작성자: '+state.writer:'',...fields.filter(f=>(d[f]||'').trim()).map(f=>'['+labels[f]+']\n'+d[f])].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(txt);toast('복사했습니다. 패들렛 댓글에 붙여 넣어 주세요.')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'복사했습니다. 패들렛 댓글에 붙여 넣어 주세요.':'복사를 지원하지 않습니다. 인쇄 / PDF로 보관해 주세요.')}};
